name: Build Life Ledger OS and update Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/life-ledger-pages.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: life-ledger-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci --no-audit --no-fund
      - name: Check and build
        working-directory: site
        run: |
          npm run check
          npm run build
      - name: Update the existing published homepage
        run: |
          node site/scripts/publish-build.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html space-mark.svg _astro
          if ! git diff --cached --quiet; then
            git commit -m 'Update Life Ledger OS static build'
            git push origin HEAD:main
          fi
      - name: Request a Pages build for the generated commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
